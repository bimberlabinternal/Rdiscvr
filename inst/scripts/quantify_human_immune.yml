# =============================================================================
# Human Immune_All quantify spec (CellTypist High / Low)
# =============================================================================
#
# Job: author the biology of human quantification. This file is the editable
# source of truth for which CellTypist labels are counted, scored, binned by
# effector differentiation, and tested for gene detection. The Python builder
# expands the rules below into the flat TSV that Quantify10xData() reads.
#
# Build:
#   python3 inst/scripts/build_quantify_spec.py quantify_human_immune.yml \
#     -o inst/extdata/quantify_human_immune_spec.tsv
#
# What to edit here (immunologist-facing):
#   roles.*              — which Low labels act as CD4-like, CD8-like, NK, …
#   modules.*            — which UCell modules to summarize per lineage context
#   eds / activation / pct_positive — cutpoints, TCR-stim flag, gene panels
#   rules                — which metric blocks to emit (add/remove cautiously)
#   fields.*.classes     — keep aligned with the CellTypist model; prefer
#                          regenerating from pkl via --models-dir when possible
#   fields.low.parent    — Low → High parent links (required for scoped Low metrics)
#
# Related: quantify_human_to_rhesus_role_map.yml coerces these labels onto RIRA
# fields when Quantify10xData(coerceToRIRA = TRUE). Class lists and Low→High
# parents are loaded from this file; do not duplicate them in the role-map YAML.
# =============================================================================

grouping: cDNA_ID          # one wide-table row per cDNA (sample) after quantification
delimiter: "__"            # joins TargetField segments (e.g. ImmuneHigh__T_cells__CytotoxicityScore)
pipeline_meta: [Unassigned, Ambiguous, Unknown]  # post-classifier labels appended to class lists

# -----------------------------------------------------------------------------
# fields — classifier columns that hold per-cell labels
#
# high: coarse Immune_All_High lineages (T cells, ILC, Macrophages, …).
# low:  fine Immune_All_Low subtypes; parent maps each Low label to its High
#       parent so scoped metrics (e.g. Low T subtypes within High "T cells")
#       stay biologically coherent. Edit parent when CellTypist renames a
#       subtype; leave class lists alone unless the model itself changed.
# -----------------------------------------------------------------------------
fields:
  high:
    column: celltypist.Immune_All_High.cellclass
    prefix: ImmuneHigh
    pkl: Immune_All_High.pkl
    classes:
