# -----------------------------------------------------------------------------
# roles — named buckets of Low (or High) labels that rules select by name
#
# Lineage roles (cd4_like, cd8_like, nk, gamma_delta, nkt) answer: "which
# subtypes share a biological job for EDS, diversity, and gene detection?"
# Edit these lists when a new Low label should join (or leave) a job; rules
# that say select: {role: [cd4_like, …]} expand automatically.
#
# Utility roles are not lineages: apc_parents is a High-class allowlist for
# APC module scoring; pct_effector_order sets column order for pct_positive
# only (biology is unchanged by reordering).
# -----------------------------------------------------------------------------
roles:
  # Helper / regulatory / follicular CD4-axis T subtypes (EDS, diversity, FOXP3/IL2RA)
  cd4_like:
    - Follicular helper T cells
    - Memory CD4+ cytotoxic T cells
    - Regulatory T cells
    - T(agonist)
    - Tcm/Naive helper T cells
    - Tem/Effector helper T cells
    - Tem/Effector helper T cells PD1+
    - Treg(diff)
    - Type 1 helper T cells
    - Type 17 helper T cells
  # Cytotoxic / tissue-resident CD8-axis T subtypes (EDS, diversity, default genes)
  cd8_like:
    - CD8a/a
    - CD8a/b(entry)
    - MAIT cells
    - Tcm/Naive cytotoxic T cells
    - Tem/Temra cytotoxic T cells
    - Tem/Trm cytotoxic T cells
    - Trm cytotoxic T cells
  # NK and transitional NK (default genes + FCGR3/FCGR3A)
  nk:
    - NK cells
    - CD16+ NK cells
    - CD16- NK cells
    - Cycling NK cells
    - Transitional NK
  # Gamma-delta T (default genes; not in EDS/diversity select unless added there)
  gamma_delta:
    - gamma-delta T cells
    - CRTAM+ gamma-delta T cells
    - Cycling gamma-delta T cells
  # NKT (default gene panel only in this file; not EDS/diversity)
  nkt:
    - NKT cells
  # High parents treated as antigen-presenting / myeloid-B for APC UCell modules
  apc_parents:
    - B cells
    - DC
    - Granulocytes
    - MNP
    - Macrophages
    - Mast cells
    - Mono-mac
    - Monocytes
    - Myelocytes
    - Plasma cells
    - Promyelocytes
    - pDC
    - B-cell lineage
  # Column order for PctPositive outputs (does not change which cells are counted)
  pct_effector_order:
    - Tcm/Naive cytotoxic T cells
    - Tem/Temra cytotoxic T cells
    - Tem/Trm cytotoxic T cells
    - Trm cytotoxic T cells
    - CD8a/a
    - CD8a/b(entry)
    - MAIT cells
    - Tcm/Naive helper T cells
    - Tem/Effector helper T cells
    - Tem/Effector helper T cells PD1+
    - Memory CD4+ cytotoxic T cells
    - Regulatory T cells
    - Follicular helper T cells
    - Type 1 helper T cells
    - Type 17 helper T cells
    - Treg(diff)
    - T(agonist)
    - gamma-delta T cells
    - CRTAM+ gamma-delta T cells
    - Cycling gamma-delta T cells
    - NK cells
    - CD16+ NK cells
    - CD16- NK cells
    - Cycling NK cells
    - Transitional NK
    - NKT cells

# -----------------------------------------------------------------------------
# modules — UCell palettes keyed by lineage context
# Each entry is [TargetField suffix, metadata column]. Quantify10xData fills
# missing *_UCell columns before scoring. Pair a module set with a rule via
# modules: t_cell (or modules_when for High-class-dependent palettes).
# -----------------------------------------------------------------------------
modules:
  t_cell:    # CD4/CD8 T High or Low-under-T-cells
    - [CytotoxicityScore, Cytotoxicity_UCell]
    - [InterferonResponseScore, Interferon_Response_UCell]
    - [CytokineScore, TandNK_Activation2_UCell]
    - [MHCIIScore, MHCII_UCell]
    - [ProliferationScore, Proliferation_UCell]
    - [PerforinScore, Perforin_UCell]
  nk_ilc:    # ILC High or Low-under-ILC (no TandNK_Activation2 cytokine module)
    - [CytotoxicityScore, Cytotoxicity_UCell]
    - [InterferonResponseScore, Interferon_Response_UCell]
    - [MHCIIScore, MHCII_UCell]
    - [ProliferationScore, Proliferation_UCell]
    - [PerforinScore, Perforin_UCell]
  apc:       # B / myeloid / DC High parents (IFN, MHCII, proliferation)
    - [InterferonResponseScore, Interferon_Response_UCell]
    - [MHCIIScore, MHCII_UCell]
    - [ProliferationScore, Proliferation_UCell]

# -----------------------------------------------------------------------------
# tunables — cutpoints and gene panels shared by eds / activation / pct_positive
# -----------------------------------------------------------------------------
eds:
  # Score bins on Tcell_EffectorDifferentiation: Naive < low ≤ MemoryLike < high ≤ Effector
  metadata_field: Tcell_EffectorDifferentiation
  cutpoint_low: 2
  cutpoint_high: 6
  phenotypes: [Naive, MemoryLike, Effector]
activation:
  # Counts cells flagged TCR-stimulated (RIRA::PredictTcellActivation when absent)
  source_field: Is_TCR_Stimulated
  match_value: "TRUE"
pct_positive:
  order_by: pct_effector_order
  default_roles: [cd4_like, cd8_like, gamma_delta, nk, nkt]  # genes: default → these roles
  genes:
    # gene: default | [role, …]  — detection % among matched cells (counts > 0)
    PDCD1: default
    KLRK1: default
    KLRB1: default
    HAVCR2: default
    TIGIT: default
    PRF1: default
    GZMB: default
    KLRC1: default
    FCGR3: [nk]
    FCGR3A: [nk]
    FOXP3: [cd4_like]
    IL2RA: [cd4_like]

# -----------------------------------------------------------------------------
# rules — the quantification program (each archetype expands to many TSV rows)
#
# Archetypes:
#   sum          — cell counts per selected class
#   score        — p05 / median / p95 of a UCell (or other) score
#   eds          — Naive/MemoryLike/Effector bins + EDSScore quantiles
#   pct_positive — % cells with gene detected (uses pct_positive.genes above)
#   diversity    — TCR clone Hill number q=2 (rarefaction; CD4/CD8-like here)
#   activation   — count of Is_TCR_Stimulated matches within scope
#
# Prefer editing roles/modules/tunables over rewriting rules. Changing a rule's
# select or scope changes which biology enters the wide table.
# -----------------------------------------------------------------------------
rules:
  # Block 1: High lineage cell counts (all Immune_All_High classes)
  - {archetype: sum,   field: high, select: all}
  # Block 2: Low subtype counts, scoped to each subtype's High parent
  - {archetype: sum,   field: low,  select: all, scope: by_parent}
  # Block 3: High-class UCell quantiles; palette depends on lineage job
  - {archetype: score, field: high, select: all,
     modules_when: [{when: {class: T cells}, modules: t_cell},
                    {when: {class: ILC},     modules: nk_ilc},
                    {when: {class_in: apc_parents}, modules: apc}]}
  # Block 4: Low T subtypes — T-cell UCell panel within High T cells
  - {archetype: score, field: low, select: {parent: T cells}, modules: t_cell,
     scope: {field: high, value: T cells}}
  # Block 5: Low ILC subtypes — NK/ILC UCell panel within High ILC
  - {archetype: score, field: low, select: {parent: ILC}, modules: nk_ilc,
     scope: {field: high, value: ILC}}
  # Block 6: Low APC subtypes — APC UCell panel, scoped by High parent
  - {archetype: score, field: low, select: {parent_in: apc_parents}, modules: apc,
     scope: by_parent}
  # Block 7: EDS phenotype bins + score for CD4-like / CD8-like Low T
  - {archetype: eds,   field: low, select: {role: [cd4_like, cd8_like]},
     scope: {field: high, value: T cells}}
  # Block 8: Gene detection % for Low T/ILC subtypes (see pct_positive.genes)
  - {archetype: pct_positive, field: low, scope: {by_parent_in: [T cells, ILC]}}
  # Block 9: TCR diversity (q=2) for CD4-like / CD8-like Low T
  - {archetype: diversity, field: low, select: {role: [cd4_like, cd8_like]},
     scope: {field: high, value: T cells}}
  # Block 10a: TCR-stimulated counts at High T cells
  - {archetype: activation, field: high, select: {class: T cells},
     scope: {field: high, value: T cells}}
  # Block 10b: TCR-stimulated counts per Low T subtype (scope = that subtype)
  - {archetype: activation, field: low,  select: {parent: T cells}, scope: by_self}
